<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Test App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 2rem;
      color: #1a202c;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    h2 {
      font-size: 1.1rem;
      color: #4a5568;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #667eea; }

    .row { display: flex; gap: 10px; }
    .row input { flex: 1; }

    button {
      width: 100%;
      padding: 10px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #5a67d8; }

    .result {
      margin-top: 14px;
      padding: 12px 16px;
      background: #ebf8ff;
      border-radius: 8px;
      color: #2b6cb0;
      font-size: 1rem;
      min-height: 44px;
    }
  </style>
</head>
<body>
  <h1>Simple Test App</h1>

  <div class="card">
    <h2>Greet someone</h2>
    <input type="text" id="nameInput" placeholder="Enter a name..." />
    <button onclick="greet()">Say Hello</button>
    <div class="result" id="greetResult"></div>
  </div>

  <div class="card">
    <h2>Add two numbers</h2>
    <div class="row">
      <input type="number" id="numA" placeholder="First number" />
      <input type="number" id="numB" placeholder="Second number" />
    </div>
    <button onclick="add()">Calculate</button>
    <div class="result" id="addResult"></div>
  </div>

  <script>
    function greet() {
      const name = document.getElementById('nameInput').value.trim();
      const result = document.getElementById('greetResult');
      result.textContent = name ? `Hello, ${name}!` : 'Please enter a name.';
    }

    function add() {
      const a = document.getElementById('numA').value;
      const b = document.getElementById('numB').value;
      const result = document.getElementById('addResult');
      if (a === '' || b === '') {
        result.textContent = 'Please enter both numbers.';
      } else {
        result.textContent = `${a} + ${b} = ${parseFloat(a) + parseFloat(b)}`;
      }
    }

    document.getElementById('nameInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') greet();
    });
  </script>
</body>
</html>
